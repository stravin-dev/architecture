[project]
site_name = "Stravin Architecture"
site_description = "System architecture, design specs, RFCs, and ADRs for the Stravin platform."
docs_dir = "docs"
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Overview" = "index.md" },
  { "Core Architecture" = [
    { "System Topology & Flows" = "core/topology.md" },
    { "Storage: S3 & DynamoDB" = "core/storage.md" },
    { "Multi-Region HA & CAP/PACELC" = "core/ha-consistency.md" },
    { "Performance & Compaction" = "core/performance.md" },
    { "Server-Side Wasm Hooks" = "core/hooks.md" },
    { "Isolation & Multi-Tenancy" = "core/isolation-multitenancy.md" },
  ] },
  { "Product Interfaces" = [
    { "Overview & Matrix" = "interfaces/index.md" },
    { "Core ⟷ Review" = "interfaces/core-review.md" },
    { "Core ⟷ Run" = "interfaces/core-run.md" },
    { "Core ⟷ Index" = "interfaces/core-index.md" },
    { "Core ⟷ Gate" = "interfaces/core-gate.md" },
    { "Review ⟷ Run" = "interfaces/review-run.md" },
    { "Review ⟷ Gate" = "interfaces/review-gate.md" },
    { "Run ⟷ Gate" = "interfaces/run-gate.md" },
    { "Review ⟷ Index" = "interfaces/review-index.md" },
    { "External Webhooks" = "interfaces/external-webhooks.md" },
    { "Platform Auth" = "interfaces/platform-auth.md" },
    { "Platform Notify" = "interfaces/platform-notify.md" },
  ] },
  { "UI Design" = [
    { "Overview & Shell" = "ui/index.md" },
    { "Pull Requests" = "ui/pull-requests.md" },
    { "Actions & Workflows" = "ui/actions-runs.md" },
    { "Settings" = "ui/settings.md" },
  ] },
  { "Architecture Decision Records" = [
    { "ADR-0001: Transport, Events & Webhooks" = "adr/0001-platform-transport-events-webhooks.md" },
    { "ADR-0002: External Runner Seam & OIDC Auth" = "adr/0002-external-runner-seam-and-oidc-auth.md" },
    { "ADR-0003: Platform Auth & SSO Seam" = "adr/0003-platform-auth-and-sso-seam.md" },
    { "ADR-0004: Web Frontend Stack (SPA + Go BFF)" = "adr/0004-frontend-stack-spa-go-bff.md" },
    { "ADR-0005: Workflow Execution & Runner Runtime" = "adr/0005-workflow-execution-and-runner-runtime.md" },
  ] },
  { "Roadmap" = [
    { "Full-Stack Build Waves" = "roadmap/full-stack-waves.md" },
  ] },
  { "Operations & Tooling" = [
    { "Local Development" = "operations/local-dev.md" },
    { "Telemetry & Observability" = "operations/telemetry.md" },
    { "Load Testing & Chaos" = "operations/load-testing.md" },
    { "Service Scaling" = "operations/scaling.md" },
    { "Zero-Downtime Deployment" = "operations/deployment.md" },
  ] },
]

[project.extra]
generator = false

[project.theme]
language = "en"
favicon = "assets/images/favicon.svg"
logo = "assets/images/stravin-mark-dark.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
