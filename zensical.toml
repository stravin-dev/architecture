[project]
site_name = "Stravin Architecture"
site_description = "System architecture, design specs, RFCs, and ADRs for the Stravin platform."
docs_dir = "docs"
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Overview" = "index.md" },
  { "Core Architecture" = [
    { "System Topology & Flows" = "core/topology.md" },
    { "Storage: S3 & DynamoDB" = "core/storage.md" },
    { "Multi-Region HA & CAP/PACELC" = "core/ha-consistency.md" },
    { "Performance & Compaction" = "core/performance.md" },
    { "Server-Side Wasm Hooks" = "core/hooks.md" },
    { "Isolation & Multi-Tenancy" = "core/isolation-multitenancy.md" },
  ] },
  { "Operations & Tooling" = [
    { "Local Development" = "operations/local-dev.md" },
    { "Telemetry & Observability" = "operations/telemetry.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
